<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Étudiants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090f;
      --bg2: #0f0f1a;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.38);
      --accent: #7c6aff;
      --accent2: #ff6ac1;
      --accent3: #00e5c3;
      --glow: rgba(124,106,255,0.15);
      --nav-h: 68px;
      --font-display: 'Fraunces', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
    }

    /* Ambient blobs */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 700px 500px at 10% 20%, rgba(124,106,255,0.1) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 90% 80%, rgba(255,106,193,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 400px 300px at 50% 50%, rgba(0,229,195,0.05) 0%, transparent 70%);
    }

    /* ── NAVBAR ── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      background: rgba(9,9,15,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 clamp(20px, 5vw, 80px);
    }

    .navbar-inner {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(124,106,255,0.35);
      position: relative;
    }

    .nav-logo-icon::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      z-index: -1;
      opacity: 0.4;
      filter: blur(8px);
    }

    .nav-logo-icon svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-logo-text {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .nav-logo-sub {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Nav links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      list-style: none;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .nav-links a svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .nav-links a:hover {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
    }

    .nav-links a.active {
      color: var(--accent);
      background: rgba(124,106,255,0.1);
      border-color: rgba(124,106,255,0.2);
      font-weight: 600;
    }

    /* CTA */
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff !important;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.3s, opacity 0.2s;
      flex-shrink: 0;
      position: relative;
      letter-spacing: 0.01em;
    }

    .nav-cta::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      z-index: -1;
      opacity: 0;
      filter: blur(12px);
      transition: opacity 0.3s;
    }

    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124,106,255,0.4);
    }

    .nav-cta:hover::before { opacity: 0.6; }

    .nav-cta svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Burger */
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 38px;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      padding: 9px;
      transition: border-color 0.2s, background 0.2s;
    }

    .nav-burger:hover {
      border-color: var(--border-hover);
      background: rgba(255,255,255,0.07);
    }

    .nav-burger span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: var(--muted);
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s, background 0.2s;
    }

    .nav-burger.open span { background: var(--text); }
    .nav-burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-burger.open span:nth-child(2) { opacity: 0; }
    .nav-burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* Mobile menu */
    .mobile-menu {
      display: none;
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      background: rgba(9,9,15,0.96);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px clamp(20px, 5vw, 80px) 20px;
      flex-direction: column;
      gap: 4px;
      z-index: 99;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }

    .mobile-menu a svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mobile-menu a:hover,
    .mobile-menu a.active {
      color: var(--accent);
      background: rgba(124,106,255,0.08);
      border-color: rgba(124,106,255,0.15);
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* ── FOOTER ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 28px clamp(20px, 5vw, 80px);
      margin-top: auto;
      position: relative;
      z-index: 1;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .footer-dot {
      width: 7px;
      height: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }

    .footer-copy {
      font-size: 12px;
      color: var(--muted);
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--text); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav-links, .nav-cta { display: none; }
      .nav-burger { display: flex; }
      .footer-links { display: none; }
    }

    @media (max-width: 480px) {
      .nav-logo-sub { display: none; }
    }
  </style>
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <header class="navbar">
    <div class="navbar-inner">

      <!-- Logo -->
      <a href="/" class="nav-logo">
        <div class="nav-logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="nav-logo-text">GestionEtudiant</div>
          <div class="nav-logo-sub">Plateforme étudiants</div>
        </div>
      </a>

      <!-- Nav desktop -->
      <nav>
        <ul class="nav-links">
          <li>
            <a href="/" id="link-accueil">
              <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Accueil
            </a>
          </li>
          <li>
            <a href="/liste" id="link-liste">
              <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              Liste
            </a>
          </li>
          <li>
            <a href="/stats" id="link-stats">
              <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              Statistiques
            </a>
          </li>
        </ul>
      </nav>

      <!-- CTA + burger -->
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="/ajouter" class="nav-cta" id="link-ajouter">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Ajouter
        </a>
        <button class="nav-burger" id="burger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>

    </div>
  </header>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="/" id="mob-accueil">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Accueil
    </a>
    <a href="/liste" id="mob-liste">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Liste
    </a>
    <a href="/stats" id="mob-stats">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Statistiques
    </a>
    <a href="/ajouter" id="mob-ajouter" style="color:var(--accent);background:rgba(124,106,255,0.08);border-color:rgba(124,106,255,0.15);margin-top:4px;">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Ajouter un étudiant
    </a>
  </div>

  <!-- ══ CONTENU ══ -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ══ FOOTER ══ -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="footer-dot"></div>
        GestionEtudiant
      </div>
      <span class="footer-copy">© 2026 Plateforme universitaire — Tous droits réservés</span>
      <div class="footer-links">
        <a href="/">Accueil</a>
        <a href="/liste">Liste</a>
        <a href="/stats">Statistiques</a>
        <a href="/ajouter">Ajouter</a>
      </div>
    </div>
  </footer>

  <script>
    /* ── Active link ── */
    const path = window.location.pathname;
    const map = {
      '/':        ['link-accueil','mob-accueil'],
      '/liste':   ['link-liste',  'mob-liste'],
      '/stats':   ['link-stats',  'mob-stats'],
      '/ajouter': ['link-ajouter','mob-ajouter'],
    };
    const ids = map[path] || [];
    ids.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('active'); });

    /* ── Burger ── */
    const burger = document.getElementById('burger');
    const mobileMenu = document.getElementById('mobile-menu');

    burger.addEventListener('click', () => {
      const open = mobileMenu.classList.toggle('open');
      burger.classList.toggle('open', open);
      burger.setAttribute('aria-expanded', open);
    });

    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        burger.classList.remove('open');
      });
    });

    document.addEventListener('click', e => {
      if (!burger.contains(e.target) && !mobileMenu.contains(e.target)) {
        mobileMenu.classList.remove('open');
        burger.classList.remove('open');
      }
    });
  </script>

</body>
</html>
